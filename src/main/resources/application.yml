spring:
  application:
    name: springboot-camel-test
    version: 1.0.0

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}

server:
  port: 8085

camel:
  springboot:
    name: springboot-camel-test
  rest:
    component: platform-http
    api-context-path: /api-docs
    api-property:
      - key: api.title
        value: SpringBoot Camel Test API
      - key: api.version
        value: 1.0.0

  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  greeting: "Hola desde Apache Camel en Spring Boot"
  file:
    inbox: data/inbox
    outbox: data/outbox
    error: data/error
  kafka:
    topic: test-topic

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761}/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO